# Copy to .github/workflows/ci.yml in a Node project that runs on Tenki runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v6
      # Mount before anything writes to ~/.npm.
      - id: npm-cache
        uses: LuxorLabs/stickydisk@v1
        with:
          key: npm-node22-v1
          path: ~/.npm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: echo "npm cache ${{ steps.npm-cache.outputs.source }} (generation ${{ steps.npm-cache.outputs.generation }})"

  lint:
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@v6
      - uses: LuxorLabs/stickydisk@v1
        with:
          key: npm-node22-v1
          path: ~/.npm
          commit: never
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
