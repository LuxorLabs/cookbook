# Link check for the cookbook's Markdown (.github/workflows/links.yml).
# 429 counts as fine: a rate limit says the page exists.
accept = ["200..=206", "429"]
max_retries = 3
timeout = 30
max_concurrency = 16
exclude_path = ["node_modules"]
exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  # Placeholders and per-sandbox URLs that only exist while a sandbox is up.
  '\.sb\.tenki\.sh',
  '<[^>]+>',
  '\{[^}]+\}',
  'example\.(com|org)',
  # Sign-in walls answer 401/403 to robots but work in a browser.
  '^https://app\.tenki\.cloud',
  '^https://(www\.)?(linkedin|x|twitter)\.com',
  '^https://platform\.openai\.com',
  '^https://console\.anthropic\.com',
]
